name: Kilowatch
options:
  bundleIdPrefix: com.elliotwaxman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Kilowatch:
    type: application
    platform: iOS
    sources:
      - Kilowatch
    info:
      path: Kilowatch/Info.plist
      properties:
        CFBundleDisplayName: Kilowatch
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        KilowatchAPIBaseURL: https://kilowatch-api.vercel.app
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elliotwaxman.kilowatch
        TARGETED_DEVICE_FAMILY: "1"
  KilowatchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KilowatchTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.elliotwaxman.kilowatch.tests
    dependencies:
      - target: Kilowatch
